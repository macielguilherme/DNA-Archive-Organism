services:
  - type: web
    name: dna-arquivo-vivo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
